<main class="container readable">
<h1>Форма авторизации</h1>

<form class="form" id="authForm">

    <label>Логин:
        <input id="loginInput" type="text">
        <small id="loginHint" class="hint"></small>
    </label>

    <label>Пароль:
        <input id="passwordInput" type="password">
        <small id="passwordHint" class="hint"></small>
    </label>

    <label>
        <input type="checkbox" id="agreeInput">
        Согласен на обработку данных
        <small id="agreeHint" class="hint"></small>
    </label>

    <button type="submit" class="form__submit">Отправить</button>
</form>

<button id="loadDataBtn" class="button">Получить данные</button>

<pre id="serverOutput"></pre>
</main>
